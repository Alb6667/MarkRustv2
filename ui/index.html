<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>MarkRust</title>

<!-- Semua library di-vendoring lokal: aplikasi tetap berfungsi offline. -->
<link rel="stylesheet" href="vendor/quill/quill.snow.css">
<link rel="stylesheet" href="vendor/highlight/night-owl.min.css">

<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">
  <!-- TOOLBAR -->
  <div id="toolbar">
    <!-- Kiri: aksi berkas, lalu switch mode (keduanya simbol saja). -->
    <div class="toolbar-left">
      <div class="file-actions" role="group" aria-label="Aksi berkas">
        <button class="ghost-btn" id="btn-new" type="button"
                title="Dokumen baru (Ctrl+N)" aria-label="Dokumen baru">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/>
          </svg>
        </button>
        <button class="ghost-btn" id="btn-open" type="button"
                title="Buka berkas (Ctrl+O)" aria-label="Buka berkas">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
        </button>
        <button class="ghost-btn" id="btn-save" type="button"
                title="Simpan (Ctrl+S) · Shift untuk Simpan Sebagai" aria-label="Simpan berkas">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/>
          </svg>
        </button>
      </div>
      <span class="tb-divider" aria-hidden="true"></span>
      <div class="mode-switch" role="group" aria-label="Mode editor">
        <button class="mode-btn active" id="btn-wysiwyg" type="button"
                title="Mode WYSIWYG" aria-label="Mode WYSIWYG">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button class="mode-btn" id="btn-markdown" type="button"
                title="Mode Markdown" aria-label="Mode Markdown">
          <span class="mode-glyph" aria-hidden="true">⟨/⟩</span>
        </button>
      </div>
    </div>

    <!-- Tengah: seluruh kontrol format Quill. -->
    <div id="quill-toolbar"></div>

    <!-- Kanan: pin lalu simbol aplikasi. -->
    <div class="toolbar-right">
      <!-- Pin: menahan toolbar supaya selalu tampil dan auto-hide mati. -->
      <button class="pin-btn" id="btn-pin" type="button"
              aria-pressed="false" title="Pin toolbar (selalu tampil)"
              aria-label="Pin toolbar">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 17v5"/>
          <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
        </svg>
      </button>
      <span class="tb-divider" aria-hidden="true"></span>
      <!-- Brand cukup simbol: nama aplikasi disampaikan lewat aria-label. -->
      <span class="brand" role="img" aria-label="MarkRust">◆</span>
    </div>
  </div>

  <!-- WYSIWYG EDITOR -->
  <div id="editor-wrap">
    <div id="editor"></div>
  </div>

  <!-- RAW MARKDOWN VIEW -->
  <div id="raw-view">
    <textarea id="raw-textarea" placeholder="Raw Markdown..." spellcheck="false"></textarea>
  </div>

  <!-- STATUS BAR: selalu tampil, tidak lagi mengambang dan memudar sendiri. -->
  <footer id="statusbar" role="status" aria-live="polite">
    <div class="sb-left">
      <span class="sb-mode" id="sb-mode">WYSIWYG</span>
      <span class="sb-sep" aria-hidden="true"></span>
      <span id="sb-file">Tanpa Judul</span>
      <span id="sb-dirty" hidden>● belum disimpan</span>
      <span id="sb-draft-error" role="status" hidden>⚠ Cadangan gagal — simpan berkas sekarang</span>
    </div>
    <div class="sb-right">
      <span id="sb-notice" hidden></span>
      <button type="button" id="sb-load-images" class="sb-action" hidden
              title="Muat gambar dari jaringan untuk dokumen ini saja"
              aria-label="Muat gambar jarak jauh">Muat gambar</button>
      <span id="stat-words">Words: 0</span>
      <span class="sb-sep" aria-hidden="true"></span>
      <span id="stat-chars">Chars: 0</span>
    </div>
  </footer>
</div>

<dialog id="recovery-dialog" aria-labelledby="recovery-title">
  <h2 id="recovery-title">Pilih draf untuk dipulihkan</h2>
  <p>Sesi aktif tidak ditampilkan. Draf lain tetap disimpan.</p>
  <div id="recovery-list"></div>
  <form method="dialog"><button type="submit">Nanti saja</button></form>
</dialog>

<!-- Dialog URL gambar. window.prompt tidak reliabel di webview Tauri. -->
<dialog id="image-dialog" aria-labelledby="image-dialog-title">
  <form method="dialog" id="image-form">
    <h2 id="image-dialog-title">Sisipkan gambar</h2>
    <p>Masukkan alamat gambar. Berkas lokal dan <code>data:</code> tidak didukung agar berkas .md tetap ringan.</p>
    <input type="text" inputmode="url" id="image-url" placeholder="https://contoh.com/gambar.png"
           autocomplete="off" spellcheck="false">
    <div class="dlg-error" id="image-error" aria-live="polite"></div>
    <div class="dlg-actions">
      <button type="button" id="image-cancel">Batal</button>
      <button type="submit" class="primary" id="image-ok">Sisipkan</button>
    </div>
  </form>
</dialog>

<!-- Library klasik (UMD/IIFE) dimuat lebih dulu karena app.js adalah ES module
     yang dievaluasi secara deferred; global Quill/marked/hljs sudah siap. -->
<script src="vendor/highlight/highlight.min.js"></script>
<script src="vendor/quill/quill.js"></script>
<script src="vendor/marked/marked.umd.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
