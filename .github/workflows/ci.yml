name: CI

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Konversi Markdown adalah bagian paling rapuh => diuji lebih dulu dan
  # dijalankan di semua PR. Jsdom menjalankan Quill 2 + marked yang SAMA dengan
  # yang di-vendoring, jadi ini round-trip sungguhan, bukan mock.
  # ---------------------------------------------------------------------------
  test:
    name: Tes konversi (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # ---------------------------------------------------------------------------
  # Toolchain Rust tidak selalu tersedia di mesin kontributor. Job ini yang
  # menjamin kode Rust tetap bisa dikompilasi di ketiga sistem operasi.
  # ---------------------------------------------------------------------------
  rust-check:
    name: Build Rust (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Dependensi sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo build
        run: cargo build --manifest-path src-tauri/Cargo.toml

  # ---------------------------------------------------------------------------
  # Bundel installer hanya dibuat saat rilis, supaya PR tidak memakan menit
  # CI untuk mengunduh toolchain bundling yang berat.
  # ---------------------------------------------------------------------------
  bundle:
    name: Bundel rilis
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, rust-check]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Dependensi sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'MarkRust ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
